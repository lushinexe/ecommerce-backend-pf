version: '3.9'

services:
  app:
    build: .
    container_name: backend3-app
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://db:27017/backend3
      - NODE_ENV=development
    depends_on:
      - db

  db:
    image: mongo:6
    container_name: backend3-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
